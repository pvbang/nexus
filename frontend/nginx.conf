# ============================================================
# Nexus - Nginx Reverse Proxy (Separated Docker Mode)
# Frontend static files + proxy to backend API/WS
# ============================================================
# BUG-1 FIX: hostname "backend" → "nexus" (matches docker-compose service name)
# BUG-2 FIX: Added /v1/ and /health proxy locations
# BUG-3 FIX: Increased timeouts to match PIPELINE_TIMEOUT (1800s)

upstream nexus_backend {
    server nexus:8000;
    keepalive 32;
}

server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # ── SSE streaming: tắt hoàn toàn buffer ──────────────────────────────
    location /api/v1/chat/stream {
        proxy_pass http://nexus_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tắt buffer — quan trọng nhất cho SSE real-time
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 1800s;

        # Giữ kết nối mở (SSE là long-lived HTTP)
        proxy_set_header Connection '';
        chunked_transfer_encoding on;

        # Bảo Nginx không nén SSE
        gzip off;
    }

    # ── Các API còn lại ──────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://nexus_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        # BUG-3 FIX: Match backend PIPELINE_TIMEOUT (1800s = 30 min)
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # ── OpenAI-compatible endpoint (BUG-2 FIX) ───────────────────────────
    location /v1/ {
        proxy_pass http://nexus_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # ── Health check endpoint (BUG-2 FIX) ────────────────────────────────
    location /health {
        proxy_pass http://nexus_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
    }

    # ── WebSocket chat ────────────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://nexus_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ── OpenAPI docs ─────────────────────────────────────────────────────
    location /openapi.json {
        proxy_pass http://nexus_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── Static frontend (SPA catch-all) ──────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }

    # ── Gzip compression for text assets ─────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ── Security headers ─────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
