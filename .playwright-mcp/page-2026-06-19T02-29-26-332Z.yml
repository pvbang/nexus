            - generic [ref=e94]: DESCRIPTION
            - generic [ref=e95]:
              - heading "BS EN ISO 17636-1:2022" [level=1] [ref=e96]
              - text: "This standard BS EN ISO 17636-1:2022 Non-destructive testing of welds. Radiographic testing is classified in these ICS categories:"
              - list [ref=e97]:
                - listitem [ref=e98]: 25.160.40 Welded joints and welds
              - text: This document specifies techniques of radiographic testing of fusion-welded joints in metallic materials using industrial radiographic film techniques with the object of enabling satisfactory and repeatable results. The techniques are based on generally recognized practice and fundamental theory of the subject. It applies to the joints of plates and pipes in metallic materials. Besides its conventional meaning, “pipe” as used in this document covers other cylindrical bodies, such as tubes, penstocks, boiler drums and pressure vessels. This document does not specify acceptance levels for any of the indications found on the radiographs. The ISO 10675 series provides information on acceptance levels for weld evaluation. If contracting parties apply lower test criteria, it is possible that the quality achieved will be significantly lower than when this document is strictly applied.
            - generic [ref=e99]:
              - heading "BS EN ISO 17636-1:2022 Non-destructive testing of welds. Radiographic testing X- and gamma-ray techniques with film" [level=1] [ref=e100]
              - paragraph [ref=e101]:
                - strong [ref=e102]: "Standard number:"
                - text: BS EN ISO 17636-1:2022
              - paragraph [ref=e103]:
                - strong [ref=e104]: "Pages:"
                - text: "46"
              - paragraph [ref=e105]:
                - strong [ref=e106]: "Released:"
                - text: 2022-08-05
              - paragraph [ref=e107]:
                - strong [ref=e108]: "ISBN:"
                - text: 978 0 539 04732 5
              - paragraph [ref=e109]:
                - strong [ref=e110]: "Name:"
                - text: Non-destructive testing of welds. Radiographic testing X- and gamma-ray techniques with film
              - paragraph [ref=e111]:
                - strong [ref=e112]: "Status:"
                - text: Standard
              - heading "Overview" [level=2] [ref=e113]
              - paragraph [ref=e114]:
                - text: Introducing the
                - strong [ref=e115]: BS EN ISO 17636-1:2022
                - text: ", the definitive standard for non-destructive testing of welds using radiographic testing techniques with X- and gamma-rays. This comprehensive document, spanning 46 pages, is an essential resource for professionals in the field of welding and quality assurance, providing the latest guidelines and methodologies to ensure the highest standards of safety and integrity in welded structures."
              - heading "Key Features" [level=2] [ref=e116]
              - list [ref=e117]:
                - listitem [ref=e118]:
                  - strong [ref=e119]: "Comprehensive Coverage:"
                  - text: This standard offers an in-depth exploration of radiographic testing techniques, ensuring you have all the information needed to perform accurate and reliable weld inspections.
                - listitem [ref=e120]:
                  - strong [ref=e121]: "Latest Guidelines:"
                  - text: Released on 2022-08-05, this document incorporates the most recent advancements and best practices in the field, ensuring your testing methods are up-to-date.
                - listitem [ref=e122]:
                  - strong [ref=e123]: "International Standard:"
                  - text: As a BS EN ISO standard, it is recognized and respected globally, making it a valuable addition to any professional's library.
                - listitem [ref=e124]:
                  - strong [ref=e125]: "Detailed Methodologies:"
                  - text: The standard provides detailed instructions on the use of X- and gamma-ray techniques, helping you achieve precise and consistent results.
                - listitem [ref=e126]:
                  - strong [ref=e127]: "Quality Assurance:"
                  - text: Adhering to this standard ensures that your weld inspections meet the highest quality and safety standards, reducing the risk of defects and failures.
              - heading "Why Choose BS EN ISO 17636-1:2022?" [level=2] [ref=e128]
              - paragraph [ref=e129]:
                - text: In the world of welding and fabrication, ensuring the integrity and safety of welded joints is paramount. The
                - strong [ref=e130]: BS EN ISO 17636-1:2022
                - text: "standard is your go-to resource for achieving this goal. Here’s why:"
              - list [ref=e131]:
                - listitem [ref=e132]:
                  - strong [ref=e133]: "Expertly Crafted:"
                  - text: Developed by leading experts in the field, this standard reflects the collective knowledge and experience of industry professionals.
                - listitem [ref=e134]:
                  - strong [ref=e135]: "Global Recognition:"
                  - text: As an ISO standard, it is recognized and implemented worldwide, ensuring consistency and reliability across international borders.
                - listitem [ref=e136]:
                  - strong [ref=e137]: "Enhanced Safety:"
                  - text: By following the guidelines outlined in this standard, you can significantly reduce the risk of weld failures, enhancing the overall safety of your projects.
                - listitem [ref=e138]:
                  - strong [ref=e139]: "Cost-Effective:"
                  - text: Implementing non-destructive testing techniques as per this standard can help identify potential issues early, saving you time and money in the long run.
              - heading "Who Should Use This Standard?" [level=2] [ref=e140]
              - paragraph [ref=e141]:
                - text: The
                - strong [ref=e142]: BS EN ISO 17636-1:2022
                - text: "standard is designed for a wide range of professionals involved in the welding and fabrication industry, including:"
              - list [ref=e143]:
                - listitem [ref=e144]:
                  - strong [ref=e145]: "Welding Inspectors:"
                  - text: Ensure the highest quality of welds by adhering to the latest radiographic testing techniques.
                - listitem [ref=e146]:
                  - strong [ref=e147]: "Quality Assurance Managers:"
                  - text: Implement robust testing protocols to maintain the integrity and safety of welded structures.
                - listitem [ref=e148]:
                  - strong [ref=e149]: "Engineers and Technicians:"
                  - text: Gain a thorough understanding of non-destructive testing methods to enhance your technical expertise.
                - listitem [ref=e150]:
                  - strong [ref=e151]: "Training Providers:"
                  - text: Equip your students with the most up-to-date knowledge and skills in radiographic testing of welds.
              - heading "Detailed Content" [level=2] [ref=e152]
              - paragraph [ref=e153]:
                - text: The
                - strong [ref=e154]: BS EN ISO 17636-1:2022
                - text: "standard covers a wide range of topics related to radiographic testing of welds, including but not limited to:"
              - list [ref=e155]:
                - listitem [ref=e156]:
                  - strong [ref=e157]: "Principles of Radiographic Testing:"
                  - text: An overview of the fundamental principles and concepts behind radiographic testing using X- and gamma-rays.
                - listitem [ref=e158]:
                  - strong [ref=e159]: "Equipment and Materials:"
                  - text: Detailed information on the types of equipment and materials required for effective radiographic testing.
                - listitem [ref=e160]:
                  - strong [ref=e161]: "Testing Procedures:"
                  - text: Step-by-step guidelines on how to conduct radiographic tests, including preparation, execution, and evaluation.
                - listitem [ref=e162]:
                  - strong [ref=e163]: "Safety Considerations:"
                  - text: Essential safety protocols and precautions to ensure the well-being of personnel and the environment.
                - listitem [ref=e164]:
                  - strong [ref=e165]: "Interpretation of Results:"
                  - text: Guidance on how to accurately interpret radiographic images and identify potential defects.
                - listitem [ref=e166]:
                  - strong [ref=e167]: "Documentation and Reporting:"
                  - text: Best practices for documenting and reporting test results to ensure transparency and traceability.
              - heading "Conclusion" [level=2] [ref=e168]
              - paragraph [ref=e169]:
                - text: The
                - strong [ref=e170]: BS EN ISO 17636-1:2022
                - text: standard is an indispensable resource for anyone involved in the non-destructive testing of welds. With its comprehensive coverage, up-to-date guidelines, and global recognition, it provides the knowledge and tools needed to ensure the highest standards of quality and safety in welded structures. Whether you are a welding inspector, quality assurance manager, engineer, technician, or training provider, this standard will help you achieve excellence in your field.
