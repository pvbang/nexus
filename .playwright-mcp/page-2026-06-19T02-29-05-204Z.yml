              - text: "This standard BS EN 10204:2004 Metallic products. Types of inspection documents is classified in these ICS categories:"
              - list [ref=e96]:
                - listitem [ref=e97]: 77.120.01 Non-ferrous metals in general
                - listitem [ref=e98]: 77.040.01 Testing of metals in general
                - listitem [ref=e99]: 01.110 Technical product documentation
                - listitem [ref=e100]: 77.080.01 Ferrous metals in general
                - listitem [ref=e101]: 77.140.01 Iron and steel products in general
                - listitem [ref=e102]: 77.150.01 Products of non-ferrous metals in general
              - paragraph [ref=e103]: 1.1 This document specifies the different types of inspection documents supplied to the purchaser, in accordance with the requirements of the order, for the delivery of all metallic products e.g. plates, sheets, bars, forgings, castings, whatever their method of production.
              - paragraph [ref=e104]: 1.2 This document may also apply to non-metallic products.
              - paragraph [ref=e105]: 1.3 This document is used in conjunction with the product specifications which specify the technical delivery conditions of the products.
              - blockquote [ref=e106]:
                - paragraph [ref=e107]: NOTE 1 The list of information that may be included in the inspection documents can be found in appropriate documents, e.g. EN 10168 for steel.
