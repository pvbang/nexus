            - generic [ref=e93]: DESCRIPTION
            - generic [ref=e94]:
              - heading "BS EN ISO 3452-1:2021" [level=1] [ref=e95]
              - text: "This standard BS EN ISO 3452-1:2021 Non-destructive testing. Penetrant testing is classified in these ICS categories:"
              - list [ref=e96]:
                - listitem [ref=e97]: 19.100 Non-destructive testing
              - text: This standard defines a method of penetrant testing used to detect discontinuities, e.g. cracks, laps, folds, porosity and lack of fusion, which are open to the surface of the material to be tested. It is mainly applied to metallic materials, but can also be performed on other materials, provided that they are inert to the test media and they are not excessively porous, examples of which are castings, forgings, welds, ceramics, etc. This standard is not intended to be used for acceptance criteria and gives no information relating to the suitability of individual test systems for specific applications nor requirements for test equipment. The term 'discontinuity' is used here in the sense that no evaluation concerning acceptability or non-acceptability is included. Methods for determining and monitoring the essential properties of penetrant testing products to be used are specified in ISO 3452-2 and ISO 3452-3.
            - generic [ref=e98]:
              - 'heading "BS EN ISO 3452-1:2021: Non-destructive Testing - Penetrant Testing General Principles" [level=1] [ref=e99]'
              - paragraph [ref=e100]:
                - text: Discover the essential guidelines and principles of non-destructive testing with the
                - strong [ref=e101]: BS EN ISO 3452-1:2021
                - text: standard. This comprehensive document is a must-have for professionals in the field of material testing, quality assurance, and engineering. Released on June 7, 2021, this standard provides the latest insights and methodologies in penetrant testing, ensuring that your practices are up-to-date and in compliance with international standards.
              - heading "Key Features of BS EN ISO 3452-1:2021" [level=2] [ref=e102]
              - list [ref=e103]:
                - listitem [ref=e104]:
                  - strong [ref=e105]: "Standard Number:"
                  - text: BS EN ISO 3452-1:2021
                - listitem [ref=e106]:
                  - strong [ref=e107]: "Pages:"
                  - text: "34"
                - listitem [ref=e108]:
                  - strong [ref=e109]: "Release Date:"
                  - text: June 7, 2021
                - listitem [ref=e110]:
                  - strong [ref=e111]: "ISBN:"
                  - text: 978 0 539 00647 6
                - listitem [ref=e112]:
                  - strong [ref=e113]: "Status:"
                  - text: Standard
              - heading "Comprehensive Coverage" [level=2] [ref=e114]
              - paragraph [ref=e115]: This standard encompasses a wide range of topics related to penetrant testing, a crucial method in non-destructive testing (NDT). It provides detailed guidelines on the general principles of penetrant testing, ensuring that practitioners can effectively detect surface-breaking defects in materials. Whether you are involved in manufacturing, construction, or maintenance, this standard is an invaluable resource for ensuring the integrity and safety of your products and structures.
              - heading "Why Choose BS EN ISO 3452-1:2021?" [level=2] [ref=e116]
              - paragraph [ref=e117]: "Adopting the BS EN ISO 3452-1:2021 standard offers numerous benefits:"
              - list [ref=e118]:
                - listitem [ref=e119]:
                  - strong [ref=e120]: "International Recognition:"
                  - text: As an ISO standard, it is recognized globally, facilitating international trade and cooperation.
                - listitem [ref=e121]:
                  - strong [ref=e122]: "Up-to-date Practices:"
                  - text: Stay ahead with the latest methodologies and practices in penetrant testing.
                - listitem [ref=e123]:
                  - strong [ref=e124]: "Quality Assurance:"
                  - text: Enhance the reliability and safety of your products by adhering to proven testing principles.
                - listitem [ref=e125]:
                  - strong [ref=e126]: "Comprehensive Guidelines:"
                  - text: Detailed instructions and principles ensure thorough understanding and application.
              - heading "Who Should Use This Standard?" [level=2] [ref=e127]
              - paragraph [ref=e128]: "The BS EN ISO 3452-1:2021 standard is designed for a wide range of professionals, including:"
              - list [ref=e129]:
                - listitem [ref=e130]: Quality Assurance Engineers
                - listitem [ref=e131]: Non-destructive Testing Technicians
                - listitem [ref=e132]: Material Scientists
                - listitem [ref=e133]: Manufacturing Engineers
                - listitem [ref=e134]: Construction Professionals
              - heading "Enhance Your Testing Capabilities" [level=2] [ref=e135]
              - paragraph [ref=e136]: By integrating the principles outlined in this standard, you can significantly enhance your testing capabilities. The document provides a structured approach to penetrant testing, ensuring that you can identify defects with precision and accuracy. This not only improves the quality of your products but also reduces the risk of failures and accidents, thereby protecting your brand reputation and customer trust.
              - heading "Stay Compliant and Competitive" [level=2] [ref=e137]
              - paragraph [ref=e138]: In today's competitive market, compliance with international standards is crucial. The BS EN ISO 3452-1:2021 standard helps you meet regulatory requirements and industry expectations, positioning your business as a leader in quality and safety. By adopting this standard, you demonstrate your commitment to excellence and continuous improvement, setting you apart from competitors.
              - heading "Conclusion" [level=2] [ref=e139]
              - paragraph [ref=e140]: The BS EN ISO 3452-1:2021 standard is an essential tool for anyone involved in non-destructive testing. With its comprehensive guidelines and international recognition, it provides the foundation for effective and reliable penetrant testing. Ensure your practices are aligned with the latest standards and enhance the quality and safety of your products with this indispensable resource.
