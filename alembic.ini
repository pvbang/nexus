# A generic, single database configuration.
# NOTE: sqlalchemy.url below is a NON-SECRET placeholder for bare local dev only.
# alembic/env.py resolves the real URL from the environment first (DATABASE_URL,
# then POSTGRES_* — see app/core/db_url.py); set those instead of editing this.
# Port must match your local PostgreSQL (default: 5432).

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/mekongai_nexus

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
